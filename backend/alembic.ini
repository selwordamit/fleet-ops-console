# ======================================================================================
# ALEMBIC CONFIGURATION | The CLI Entry Point for Migrations
# ======================================================================================
# 1. Tells Alembic where to find the migration files (script_location = alembic).
# 2. Configures logging and terminal outputs (INFO for Alembic, WARNING for the rest).
# 
# ⚠️ CRITICAL: The DATABASE_URL is intentionally NOT set here to avoid leaking secrets in Git!
#    It is dynamically injected from the app's central Config directly into env.py.
# ======================================================================================

[alembic]
script_location = alembic # go to alembic dir
prepend_sys_path = .

# Use OS path separators when rendering new migration file paths.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
