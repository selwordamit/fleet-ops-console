# Alembic configuration.
# The database URL is intentionally NOT set here — env.py loads it from
# settings.database_url so there is one source of truth and no secrets in this file.

[alembic]
script_location = alembic
prepend_sys_path = .

# Use OS path separators when rendering new migration file paths.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
